<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Task Planner</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Container -->
    <div class="container py-5">

        <!-- Header -->
        <div class="text-center mb-4">

            <h1 class="fw-bold">
                <i class="bi bi-check2-square"></i>
                Daily Task Planner
            </h1>

            <!-- Current Date -->
            <p id="currentDate" class="text-muted mb-0"></p>

        </div>


        <!-- Task Input Section -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <form id="taskForm">

                    <div class="input-group">

                        <input
                            type="text"
                            id="taskInput"
                            class="form-control"
                            placeholder="Enter a task..."
                            autocomplete="off"
                        >

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="addTaskBtn"
                        >
                            <i class="bi bi-plus-lg"></i>
                            Add Task
                        </button>

                    </div>

                    <!-- Validation message -->
                    <div id="errorMessage" class="text-danger mt-2"></div>

                </form>

            </div>
        </div>


        <!-- Filter Buttons -->
        <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">

            <button
                class="btn btn-primary filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="btn btn-outline-primary filter-btn"
                data-filter="pending"
            >
                Pending
            </button>

            <button
                class="btn btn-outline-primary filter-btn"
                data-filter="completed"
            >
                Completed
            </button>

        </div>


        <!-- Task List -->
        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <div class="d-flex justify-content-between align-items-center">

                    <span>
                        <i class="bi bi-list-task"></i>
                        My Tasks
                    </span>

                    <span id="taskCount" class="badge bg-light text-primary">
                        0
                    </span>

                </div>
            </div>

            <div class="card-body p-0">

                <!-- Tasks will be inserted here using JavaScript -->
                <ul id="taskList" class="list-group list-group-flush"></ul>

                <!-- Empty state -->
                <div
                    id="emptyMessage"
                    class="text-center text-muted p-4"
                >
                    <i class="bi bi-clipboard-check fs-1"></i>

                    <p class="mt-2 mb-0">
                        No tasks yet. Add your first task!
                    </p>
                </div>

            </div>
        </div>


        <!-- Footer -->
        <div class="text-center mt-4 text-muted small">

            <p class="mb-1">
                Daily Task Planner
            </p>

            <p class="mb-0">
                Built with HTML5, CSS3, Bootstrap 5 & JavaScript
            </p>

        </div>

    </div>


    <!-- Bootstrap 5 JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Our JavaScript -->
    <script src="script.js"></script>

</body>
</html>
